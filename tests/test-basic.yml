name: Test basic install of KittyCAD CLI
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .

      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version output: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version output is set to: $VERSION"

      - name: Assert kittycad binary is on PATH
        run: |
          if ! command -v kittycad &>/dev/null; then
            echo "FAIL: kittycad binary not found on PATH"
            exit 1
          fi
          echo "PASS: kittycad binary found at $(command -v kittycad)"

      - name: Assert kittycad version matches output
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          ACTUAL_VERSION="$(kittycad --version)"
          echo "actual version from binary: $ACTUAL_VERSION"
          echo "version from output: $VERSION"
          if [ "$ACTUAL_VERSION" != "$VERSION" ]; then
            echo "FAIL: version output '$VERSION' does not match binary version '$ACTUAL_VERSION'"
            exit 1
          fi
          echo "PASS: version output matches binary version"

      - name: Assert kittycad version contains expected version string
        run: |
          VERSION_OUTPUT="$(kittycad --version)"
          echo "version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "0.2.12"; then
            echo "FAIL: expected version 0.2.12 in output, got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: version 0.2.12 found in output"
