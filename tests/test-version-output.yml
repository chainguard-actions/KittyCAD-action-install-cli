name: Test KittyCAD CLI version output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .

      - name: Assert version output contains version string
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version output: $ACTUAL"
          # The version output should contain a version number (digits and dots)
          if ! echo "$ACTUAL" | grep -qE '[0-9]+\.[0-9]+'; then
            echo "FAIL: version output does not look like a version string: '$ACTUAL'"
            exit 1
          fi
          echo "PASS: version output contains a version number"

      - name: Assert kittycad --version runs successfully
        run: |
          VERSION_OUT="$(kittycad --version 2>&1 || kittycad -V 2>&1 || true)"
          echo "kittycad --version output: $VERSION_OUT"
          if [ -z "$VERSION_OUT" ]; then
            echo "FAIL: kittycad --version produced no output"
            exit 1
          fi
          echo "PASS: kittycad --version produced output"
