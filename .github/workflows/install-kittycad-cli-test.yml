name: "test install cli action"

on:
    pull_request:

permissions:
  contents: read

jobs:
  test-install-cli:
    strategy:
        matrix:
          os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - uses: ./
        id: install-zoo
      - name: check-install
        env:
          INSTALL_VERSION: ${{ steps.install-zoo.outputs.version }}
        run: |
            echo "Version from output is: $INSTALL_VERSION"
            zoo --version

  convert-with-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - uses: ./
        id: install-zoo
      - name: convert
        run: zoo file convert --output-format=stl test-file.obj ./
        shell: powershell
        env: 
          ZOO_TOKEN: ${{ secrets.KITTYCAD_API_TOKEN }}
