name: Test basic KittyCAD CLI installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .

      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version output: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version output is non-empty: $VERSION"

      - name: Assert kittycad binary is on PATH
        run: |
          if ! command -v kittycad >/dev/null 2>&1; then
            echo "FAIL: kittycad binary not found on PATH"
            exit 1
          fi
          echo "PASS: kittycad binary found at $(command -v kittycad)"

      - name: Assert kittycad binary is executable
        run: |
          BINARY="$(command -v kittycad)"
          if [ ! -x "$BINARY" ]; then
            echo "FAIL: kittycad binary is not executable"
            exit 1
          fi
          echo "PASS: kittycad binary is executable"

      - name: Assert version matches expected v0.1.1
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if echo "$VERSION" | grep -q "0.1.1"; then
            echo "PASS: version contains 0.1.1"
          else
            echo "FAIL: expected version to contain 0.1.1, got: $VERSION"
            exit 1
          fi
