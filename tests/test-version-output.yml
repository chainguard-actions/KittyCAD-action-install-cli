name: Test Zoo CLI version output matches expected version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .

      - name: Assert version output contains 0.2.21
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version output: $VERSION"
          if ! echo "$VERSION" | grep -q "0.2.21"; then
            echo "FAIL: expected version to contain '0.2.21', got: $VERSION"
            exit 1
          fi
          echo "PASS: version output contains '0.2.21'"

      - name: Assert zoo --version also contains 0.2.21
        run: |
          ZOO_VER="$(zoo --version)"
          echo "zoo --version: $ZOO_VER"
          if ! echo "$ZOO_VER" | grep -q "0.2.21"; then
            echo "FAIL: expected zoo --version to contain '0.2.21', got: $ZOO_VER"
            exit 1
          fi
          echo "PASS: zoo --version contains '0.2.21'"
