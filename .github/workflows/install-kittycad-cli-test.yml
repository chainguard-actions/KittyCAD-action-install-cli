name: "test install cli action"

on:
    pull_request:

permissions: {}

jobs:
  test-install-cli:
    strategy:
        matrix:
          os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - uses: ./
        id: install-kittycad
      - name: check-install
        env:
          INSTALLED_VERSION: ${{ steps.install-kittycad.outputs.version }}
        run: |
            echo "Version from output is: $INSTALLED_VERSION"
            kittycad --version

  convert-with-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - uses: ./
        id: install-kittycad
      - name: convert
        run: kittycad file convert --output-format=stl test-file.obj ./
        shell: powershell
        env: 
          KITTYCAD_TOKEN: ${{ secrets.KITTYCAD_API_TOKEN }}
